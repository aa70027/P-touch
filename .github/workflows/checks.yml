name: Software checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify application, original Excel edits and Windows file locks
        run: python -m pytest tests -q
      - name: Verify print and status UI logic
        run: node --test tests/printing_ui.test.cjs tests/status_ui.test.cjs tests/standalone_ui.test.cjs tests/editor_ui.test.cjs
      - name: Verify atomic update state under Windows sharing locks
        run: python tests/verify_update_state.py
